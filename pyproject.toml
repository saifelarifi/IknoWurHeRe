[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "IknoWurHeRe"
version = "0.2.0"
description = "Defensive local network inventory, history, and monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.7", "scapy>=2.6", "typer>=0.12", "fastapi>=0.115", "uvicorn>=0.30", "cryptography>=42.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
iknowurhere = "iknowurhere.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iknowurhere"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

